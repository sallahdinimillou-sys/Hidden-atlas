<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A291E" />
      <stop offset="100%" stop-color="#2E2118" />
    </linearGradient>
    <linearGradient id="favSunrise" x1="50" y1="10" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E5733A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#C98B4B" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="favRockRed" x1="30" y1="30" x2="50" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C98B4B" />
      <stop offset="45%" stop-color="#9C4A2F" />
      <stop offset="100%" stop-color="#7E3720" />
    </linearGradient>
    <linearGradient id="favShade" x1="50" y1="30" x2="75" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4A3426" />
      <stop offset="100%" stop-color="#1E150F" />
    </linearGradient>
  </defs>

  <!-- Background rounded badge -->
  <rect width="100" height="100" rx="22" fill="url(#favBg)" />
  <rect width="94" height="94" x="3" y="3" rx="19" stroke="#C98B4B" stroke-width="1.2" stroke-opacity="0.45" fill="none" />

  <!-- Sunrise Summit Glow -->
  <circle cx="50" cy="40" r="26" fill="url(#favSunrise)" />

  <!-- Distant High Atlas Peaks -->
  <polygon points="12,78 28,50 46,74" fill="#C98B4B" fill-opacity="0.7" />
  <polygon points="56,76 74,46 90,78" fill="#4A3426" fill-opacity="0.8" />

  <!-- Mount Toubkal Main Body -->
  <polygon points="50,18 20,78 50,72" fill="url(#favRockRed)" />
  <polygon points="50,18 50,72 80,78" fill="url(#favShade)" />

  <!-- Snow-Capped Summit Peak Crown -->
  <polygon points="50,18 38,42 46,38 50,42" fill="#FFFFFF" />
  <polygon points="50,18 50,42 55,37 62,42" fill="#F8F5F0" />
  <path d="M50 18 L50 42" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />

  <!-- Imlil Valley Juniper Green Accent -->
  <path d="M14 78 Q 32 73, 50 75 T 86 78 L 86 84 Q 50 86, 14 84 Z" fill="#55663A" />

  <!-- Summit Star -->
  <circle cx="50" cy="11" r="2.5" fill="#E5733A" />
</svg>
